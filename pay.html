<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата замовлення | ZOLOTOVA LAB SERIES</title>
  
  <!-- Підключення шрифтів -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Бібліотека генерації QR-коду -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

  <style>
    :root {
      --primary-color: #333333;
      --accent-color: #d4b58e;
      --bg-color: #f9f9f9;
      --card-bg: #ffffff;
      --input-bg: #faf9f7;
      --border-color: #e5e5e5;
      --text-main: #2a2a2a;
      --text-muted: #888888;
      --success-color: #4caf50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .payment-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      padding: 40px 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    .logo span {
      display: block;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 4px;
      color: var(--accent-color);
    }

    .header-info {
      background-color: var(--input-bg);
      border-radius: 8px;
      padding: 20px;
      margin: 25px 0;
    }

    .order-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .order-amount {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-main);
    }

    .qr-wrapper {
      margin: 20px auto;
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      border-radius: 8px;
    }

    .qr-wrapper svg {
      width: 100%;
      height: 100%;
    }

    .scan-instruction {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 25px;
      line-height: 1.5;
    }

    /* Мобільна кнопка оплати */
    .mobile-pay-btn {
      display: none;
      background-color: var(--text-main);
      color: #fff;
      text-decoration: none;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 25px;
      transition: background-color 0.3s;
    }

    .mobile-pay-btn:hover {
      background-color: #000;
    }

    .divider {
      height: 1px;
      background-color: var(--border-color);
      border-style: dashed;
      border-width: 1px 0 0 0;
      margin: 0 0 25px 0;
    }

    .details-group {
      text-align: left;
      margin-bottom: 15px;
    }

    .details-group label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .input-wrapper {
      display: flex;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    .input-wrapper input {
      flex-grow: 1;
      border: none;
      background: transparent;
      padding: 12px 15px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      font-family: monospace;
    }

    .copy-btn {
      background: transparent;
      border: none;
      border-left: 1px solid var(--border-color);
      padding: 0 15px;
      color: var(--accent-color);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.3s;
    }

    .copy-btn:hover {
      color: #b59267;
    }

    .status-text {
      margin-top: 25px;
      font-size: 13px;
      color: var(--text-muted);
    }
    
    .status-text.success {
      color: var(--success-color);
      font-weight: 600;
    }

    /* Медіа-запит для мобільних пристроїв */
    @media (max-width: 600px) {
      .qr-wrapper {
        display: none; /* Ховаємо QR на мобільних */
      }
      .scan-instruction {
        display: none;
      }
      .mobile-pay-btn {
        display: block; /* Показуємо кнопку діплінка */
      }
    }
  </style>
</head>
<body>

  <div class="payment-card">
    <div class="logo">
      ZOLOTOVA
      <span>LAB SERIES</span>
    </div>

    <div class="header-info">
      <div class="order-title" id="order-title">ЗАВАНТАЖЕННЯ...</div>
      <div class="order-amount" id="order-amount">0.00 грн</div>
    </div>

    <div class="qr-wrapper" id="qrcode-container">
      <!-- QR-код згенерується тут -->
    </div>
    
    <div class="scan-instruction">
      Відскануйте сканером смартфона<br>або у додатку банку (Приват24, Monobank, ПУМБ)
    </div>

    <a href="#" class="mobile-pay-btn" id="mobile-pay-btn">Оплатити в додатку банку</a>

    <div class="divider"></div>

    <div class="details-group">
      <label>ОТРИМУВАЧ (ФОП)</label>
      <div class="input-wrapper">
        <input type="text" id="fop-name" value="Завантаження..." readonly>
        <button class="copy-btn" onclick="copyToClipboard('fop-name', this)">Копіювати</button>
      </div>
    </div>

    <div class="details-group">
      <label>ЄДРПОУ/ІПН</label>
      <div class="input-wrapper">
        <input type="text" id="tax-id" value="Завантаження..." readonly>
        <button class="copy-btn" onclick="copyToClipboard('tax-id', this)">Копіювати</button>
      </div>
    </div>

    <div class="details-group">
      <label>РОЗРАХУНКОВИЙ РАХУНОК (IBAN)</label>
      <div class="input-wrapper">
        <input type="text" id="iban" value="Завантаження..." readonly>
        <button class="copy-btn" onclick="copyToClipboard('iban', this)">Копіювати</button>
      </div>
    </div>

    <div class="details-group">
      <label>ПРИЗНАЧЕННЯ ПЛАТЕЖУ</label>
      <div class="input-wrapper">
        <input type="text" id="purpose" value="Завантаження..." readonly>
        <button class="copy-btn" onclick="copyToClipboard('purpose', this)">Копіювати</button>
      </div>
    </div>

    <div class="status-text" id="payment-status">
      Очікуємо підтвердження платежу...
    </div>
  </div>

  <script>
    // URL твого Cloudflare Worker
    const API_BASE = "https://site-order-api.romek-ivanchenko.workers.dev";
    
    // Отримання параметрів з URL
    const urlParams = new URLSearchParams(window.location.search);
    const dealId = urlParams.get('deal_id');
    const amount = urlParams.get('amount');

    // Функція копіювання в буфер
    function copyToClipboard(inputId, btnElement) {
      const input = document.getElementById(inputId);
      input.select();
      input.setSelectionRange(0, 99999); // Для мобільних
      navigator.clipboard.writeText(input.value).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = "Скопійовано!";
        setTimeout(() => {
          btnElement.innerText = originalText;
        }, 2000);
      }).catch(err => {
        console.error('Не вдалося скопіювати текст: ', err);
      });
    }

    // Завантаження реквізитів і генерація QR
    async function loadPaymentInfo() {
      if (!dealId || !amount) {
        document.getElementById('order-title').innerText = "ПОМИЛКА";
        document.getElementById('order-amount').innerText = "Недійсне посилання";
        return;
      }

      document.getElementById('order-title').innerText = `ОПЛАТА ЗАМОВЛЕННЯ №${dealId}`;

      try {
        const response = await fetch(`${API_BASE}/payment-info?deal_id=${dealId}&amount=${amount}`);
        const data = await response.json();

        if (data.success) {
          // Заповнення текстових полів
          document.getElementById('order-amount').innerText = `${data.amount} грн`;
          document.getElementById('fop-name').value = data.fop_name;
          document.getElementById('tax-id').value = data.tax_id;
          document.getElementById('iban').value = data.iban;
          document.getElementById('purpose').value = data.purpose;

          // Встановлення посилання для мобільної кнопки (Версія 002 Deeplink)
          if (data.deep_link) {
            document.getElementById('mobile-pay-btn').href = data.deep_link;
          }

          // Генерація QR-коду на фронтенді (кодуємо URL НБУ для 100% сумісності банків)
          if (data.deep_link) {
            try {
              const qr = qrcode(0, 'M'); // Рівень корекції M
              qr.addData(data.deep_link); 
              qr.make();
              
              document.getElementById('qrcode-container').innerHTML = qr.createSvgTag({
                cellSize: 5,
                margin: 0,
                scalable: true
              });
            } catch (qrErr) {
              console.error("Помилка генерації QR на клієнті:", qrErr);
              document.getElementById('qrcode-container').innerHTML = '<span style="font-size: 12px; color: red;">Помилка QR</span>';
            }
          }

          // Запуск перевірки статусу платежу
          startStatusPolling();
          
        } else {
          throw new Error(data.error || "Помилка завантаження реквізитів");
        }
      } catch (error) {
        console.error(error);
        document.getElementById('order-title').innerText = "ПОМИЛКА ЗАВАНТАЖЕННЯ";
        document.getElementById('payment-status').innerText = "Не вдалося завантажити реквізити. Оновіть сторінку.";
      }
    }

    // Перевірка статусу оплати в CRM кожні 7 секунд
    let pollingInterval;
    async function checkPaymentStatus() {
      try {
        const response = await fetch(`${API_BASE}/payment-status?deal_id=${dealId}`);
        const data = await response.json();

        if (data.success && data.status === "paid") {
          const statusEl = document.getElementById('payment-status');
          statusEl.innerText = "✓ Оплату успішно підтверджено!";
          statusEl.className = "status-text success";
          clearInterval(pollingInterval);
        }
      } catch (err) {
        console.log("Помилка перевірки статусу:", err);
      }
    }

    function startStatusPolling() {
      // Робимо перший чек через 5 секунд, потім кожні 7 секунд
      setTimeout(() => {
        checkPaymentStatus();
        pollingInterval = setInterval(checkPaymentStatus, 7000);
      }, 5000);
    }

    // Ініціалізація при завантаженні сторінки
    window.onload = loadPaymentInfo;
  </script>
</body>
</html>
